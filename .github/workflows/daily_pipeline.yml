name: Daily AGA Pipeline Auto-Update

on:
  schedule:
    # 매일 06:00 UTC (15:00 KST) 실행
    - cron: '0 6 * * *'

  # 수동 트리거 활성화
  workflow_dispatch:
    inputs:
      run_weekly:
        description: '주간 분석(패턴+신약후보) 포함 여부'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python 설정
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pandas openpyxl pdfplumber requests lxml numpy plotly

      # 4. 오케스트레이터 실행 (APPEND 모드 + 조건부 주간 분석)
      - name: Run AGA Pipeline (Daily)
        run: |
          # 월요일이면 --weekly 자동 추가
          DAY_OF_WEEK=$(date +%u)
          WEEKLY_FLAG=""
          if [ "$DAY_OF_WEEK" = "1" ] || [ "${{ inputs.run_weekly }}" = "true" ]; then
            WEEKLY_FLAG="--weekly"
            echo "📊 주간 분석 포함 실행"
          fi

          python scripts/08_orchestrator.py --append $WEEKLY_FLAG
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          APPEND_MODE: "true"

      # 5. 파이프라인 로그 확인
      - name: Check pipeline status
        if: always()
        run: |
          if [ -f pipeline_status.json ]; then
            echo "=== Pipeline Status ==="
            cat pipeline_status.json
          fi

      # 6. 파이프라인 로그 업로드
      - name: Upload pipeline logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      # 7. 변경사항 커밋 및 푸시 (Streamlit 자동 재배포 트리거)
      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "AGA Pipeline Bot"
          git config user.email "pipeline@basgenbio.com"

          if [ -n "$(git status --porcelain)" ]; then
            # 수집된 논문 수 계산
            PAPER_COUNT=$(find new_papers -name "*.pdf" 2>/dev/null | wc -l)

            # 데이터 파일만 스테이지 (불필요한 로그 제외)
            git add AGA_data.xlsx AGA_문헌분류_결과.xlsx 2>/dev/null || true
            git add collection_log.json pipeline_status.json processed_files.json 2>/dev/null || true
            git add compound_structures.json natural_product_actives.json 2>/dev/null || true
            git add output/*.json output/*.xlsx 2>/dev/null || true
            git add compound_images/ data/ 2>/dev/null || true
            git add scripts/ .github/ requirements.txt 2>/dev/null || true

            COMMIT_DATE=$(date '+%Y-%m-%d %H:%M')
            COMMIT_MSG="🤖 Auto-update: ${COMMIT_DATE} UTC — ${PAPER_COUNT} papers"

            git commit -m "${COMMIT_MSG}" || true
            git push origin HEAD:main || echo "Push failed"
          else
            echo "No changes to commit"
          fi

      # 8. 실패 알림
      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Pipeline failed. Check logs."
          exit 1
